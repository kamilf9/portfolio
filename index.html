<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamil Fogel — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="typography.css" />
  <script src="nav-auto-hide.js" defer></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    /* Home: no horizontal page scroll; hero canvas is full viewport width and centered (typography.css override). */
    html,
    body {
      overflow-x: hidden !important;
    }

    .container {
      width: 100%;
      max-width: none;
      margin-left: auto;
      margin-right: auto;
      padding-left: var(--container-pad);
      padding-right: var(--container-pad);
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      transition: opacity 0.5s ease;
    }

    body.page-exit {
      opacity: 0;
    }

    a.project-card {
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
    }

    a.project-card:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 4px;
    }

    .custom-cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 10000;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      background: none;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      letter-spacing: -0.01em;
      text-transform: lowercase;
      white-space: nowrap;
      transform: translate3d(-100px, -100px, 0);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .custom-cursor.is-visible {
      opacity: 1;
    }

    .custom-cursor.is-suppressed-in-about {
      opacity: 0 !important;
      transition: opacity 0.25s ease;
    }

    @keyframes landingPinkFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes landingBlackRise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes landingNavDrop {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes landingContactRise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    nav.site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5000;
      padding: 0;
      background: transparent;
      will-change: transform;
      opacity: 0;
      animation: landingNavDrop 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.23s forwards;
    }

    /* After intro animation: no keyframe fill so nav-auto-hide can own transform/opacity */
    nav.site-header.site-header--landing-done {
      animation: none;
      opacity: 1;
      transform: translateY(0);
    }

    nav .brand {
      color: inherit;
      text-decoration: none;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      transition: filter 0.3s ease;
    }

    nav a:hover {
      filter: blur(4px);
    }

    .hero-view .container.hero-view__inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      width: 100%;
      padding-top: clamp(1rem, 4vh, 3rem);
      padding-bottom: clamp(1rem, 4vh, 3rem);
      padding-left: 0;
      padding-right: 0;
      max-width: none;
      overflow-x: visible;
      overflow-y: visible;
    }

    .site-contact {
      position: absolute;
      left: var(--container-pad);
      right: auto;
      bottom: 24px;
      text-align: left;
      align-items: flex-start;
      color: #000000;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      transform: translateY(0);
      transition: opacity 0.4s cubic-bezier(0.25, 0.1, 0.25, 1),
        transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1),
        visibility 0.4s ease;
      opacity: 0;
      animation: landingContactRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.68s forwards;
    }

    .site-contact.is-hidden-on-scroll {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(12px);
    }

    .site-contact__label {
      margin: 0;
    }

    .site-contact__line {
      margin: 0;
    }

    .page-main {
      position: relative;
      padding-top: 5.5rem;
      width: 100%;
      overflow-x: visible;
    }

    .hero-view {
      position: relative;
      overflow-x: visible;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      min-height: calc(100vh - 5.5rem);
      min-height: calc(100svh - 5.5rem);
    }

    /* Hero: full-bleed stack + WebGL (no max-width grid); overflow visible through chain */
    .hero-stage {
      width: 100%;
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      min-height: 0;
      box-sizing: border-box;
      background: transparent;
      overflow: visible;
    }

    .hero-3d {
      /* Content width (layer1 + visual match to image_18); window below is 100vw to avoid clip */
      --hero-band-vw: 83.3vw;
      position: relative;
      width: 100%;
      max-width: none;
      margin: 0;
      transform-origin: center center;
      opacity: 1;
      transform: none;
      box-sizing: border-box;
      overflow: visible !important;
    }

    .hero-3d__stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: none;
      min-width: 0;
      min-height: clamp(260px, 52vh, 600px);
      margin: 0 auto;
      line-height: 0;
      font-size: 0;
      overflow: visible !important;
    }

    .hero-3d__base-wrap {
      position: relative;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw !important;
      max-width: none !important;
      left: 50%;
      transform: translateX(-50%);
      flex: 0 0 auto;
      box-sizing: border-box;
    }

    .hero-3d__base {
      position: relative;
      z-index: 0;
      display: block;
      width: var(--hero-band-vw, 83.3vw);
      max-width: none;
      height: auto;
      margin: 0;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transform: none;
      transform-origin: center center;
      opacity: 0;
      animation: landingBlackRise 1.25s cubic-bezier(0.22, 1, 0.36, 1) 0.63s forwards;
    }

    .hero-3d__float-wrap {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      perspective: 1000px;
      perspective-origin: 50% 50%;
      box-sizing: border-box;
      overflow: visible !important;
    }

    .hero-3d__float-inner {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      box-sizing: border-box;
      overflow: visible !important;
    }

    /*
     * Full viewport width for WebGL raster (no edge clip on pink type); layer1 stays --hero-band-vw.
     */
    .hero-3d__canvas-mount {
      position: absolute !important;
      width: 100vw !important;
      max-width: none !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, calc(-50% - 50px)) !important;
      height: auto;
      min-height: clamp(192px, 32vw, 380px);
      max-height: min(52vh, 500px);
      overflow: visible !important;
      box-sizing: border-box;
      opacity: 0;
      animation: landingPinkFade 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.09s forwards;
    }

    .hero-3d__canvas-mount canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      object-fit: contain;
    }

    @media (max-width: 767px) {
      .hero-3d__float-inner {
        transform: none !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      nav.site-header,
      .hero-3d__base,
      .hero-3d__canvas-mount,
      .site-contact {
        animation: none !important;
      }

      nav.site-header {
        opacity: 1 !important;
      }

      .hero-3d__base {
        opacity: 1 !important;
        transform: none !important;
      }

      .hero-3d__canvas-mount {
        opacity: 1 !important;
      }

      .site-contact {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /*
     * Projects: full width inside site container (same horizontal inset as nav `.container`).
     * Column gap = 1.5rem (gap-x-6).
     */
    .projects-wrap {
      --project-col-gap: 1.5rem;
      --project-row-gap: 3.5rem;
      position: relative;
      z-index: 0;
      margin-top: 40px;
      padding-bottom: clamp(2.5rem, 6vh, 4rem);
      box-sizing: border-box;
      background: #ffffff;
    }

    /*
     * About: sticky full-viewport stack over projects (z-index 999), solid white.
     */
    .about-overlap-section {
      position: sticky;
      top: 0;
      z-index: 999;
      width: 100%;
      max-width: 100vw;
      margin-left: 0;
      margin-right: 0;
      box-sizing: border-box;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .about-fullbleed {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .about-fullbleed__img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
      object-position: top center;
    }

    /* Same horizontal inset as nav .container → aligns with “Kamil Fogel” */
    .about-back-to-top-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.5rem;
      z-index: 1000;
      width: 100%;
      box-sizing: border-box;
      pointer-events: none;
    }

    .about-back-to-top-wrap .about-back-to-top {
      pointer-events: auto;
    }

    .about-back-to-top {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.35;
      color: #000000;
      background: transparent;
      border: none;
      padding: 0.25rem 0;
      margin: 0;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      -webkit-font-smoothing: antialiased;
      transition: filter 0.3s ease;
      display: inline-flex;
      align-items: center;
      flex-direction: row;
      gap: 0.22em;
    }

    .about-back-to-top::after {
      content: '';
      display: block;
      width: 0.88em;
      height: 0.8em;
      flex-shrink: 0;
      background: var(--arrow-ne-svg) no-repeat center / contain;
      transform: rotate(-45deg);
      transform-origin: center center;
    }

    .about-back-to-top:hover {
      filter: blur(4px);
    }

    .about-back-to-top:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 4px;
    }

    #about,
    #work {
      scroll-margin-top: 5.5rem;
    }

    .site-bottom-sentinel {
      height: 0;
      width: 100%;
      pointer-events: none;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--project-col-gap);
      row-gap: var(--project-row-gap);
      align-items: start;
      width: 100%;
      min-width: 0;
    }

    .project-item {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.2, 0.6, 0.2, 1),
        transform 0.8s cubic-bezier(0.2, 0.6, 0.2, 1);
    }

    .project-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .project-item:hover .project-card__img {
      transform: scale(0.97);
      filter: none;
    }

    .projects-grid .project-item:nth-child(2n).visible {
      transition-delay: 0.1s;
    }

    .projects-grid .project-item:nth-child(2n):not(.visible) {
      transition-delay: 0s;
    }

    .project-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .project-card__caption {
      margin: 0;
      width: 100%;
      text-align: center;
      color: #000000;
      filter: blur(0);
      transition: filter 0.4s ease;
    }

    .project-item:hover .project-card__caption {
      filter: blur(4px);
    }

    .project-card__caption-sep {
      display: inline-block;
      padding: 0 8px;
      vertical-align: baseline;
    }

    .project-card__media {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .project-card__img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      transform: scale(1);
      filter: none;
      transition: transform 0.4s ease;
    }

    @media (min-width: 768px) and (max-width: 1024px) {
      .project-card__caption-name,
      .project-card__caption-type {
        font-size: 13px;
      }
    }

    @media (max-width: 767px) {
      .hero-3d {
        max-width: none;
      }

      .projects-grid {
        grid-template-columns: 1fr;
        column-gap: 0;
        row-gap: var(--project-row-gap);
      }

      .projects-grid .project-item:nth-child(2n).visible {
        transition-delay: 0s;
      }

      .projects-wrap {
        --project-col-gap: var(--grid-gutter, 16px);
      }
    }
  </style>
</head>

  <div id="site-bottom" class="site-bottom-sentinel" tabindex="-1" aria-hidden="true"></div>

  <script>
    (function bindAboutNavScrollToBottom() {
      function scrollPageBottomSmooth() {
        var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        window.scrollTo({ top: h, behavior: 'smooth' });
      }
      var aboutNavLinks = document.querySelectorAll('a.js-nav-about-bottom');
      for (var an = 0; an < aboutNavLinks.length; an++) {
        aboutNavLinks[an].addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey) return;
          e.preventDefault();
          scrollPageBottomSmooth();
        });
      }
      if (window.location.hash === '#site-bottom') {
        function runHashScroll() {
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(scrollPageBottomSmooth);
          });
        }
        if (document.readyState === 'complete') runHashScroll();
        else window.addEventListener('load', runHashScroll);
      }
    })();

    (function () {
      function bindPageTransitions() {
        var pageLinks = document.querySelectorAll('a.js-page-transition');
        for (var p = 0; p < pageLinks.length; p++) {
          pageLinks[p].addEventListener('click', function (e) {
            var href = this.getAttribute('href');
            if (!href || this.getAttribute('target') === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            document.body.classList.add('page-exit');
            window.setTimeout(function () {
              window.location.href = href;
            }, 480);
          });
        }
      }
      bindPageTransitions();

      var cursorEl = document.getElementById('customCursor');
      var cursorLabelEl = document.getElementById('cursorLabel');
      var heroFloatInner = document.getElementById('heroFloatInner');
      var heroKamilMount = document.getElementById('heroKamilMount');

      function isHeroMotionEnabled() {
        return window.matchMedia('(min-width: 768px)').matches;
      }
      var aboutSection = document.getElementById('about');
      var backToTopEl = document.getElementById('backToTop');
      var revealTargets = document.querySelectorAll('.js-project-reveal');
      var heroSectionForCursor = document.querySelector('.hero-view');
      var projectsSectionForCursor = document.getElementById('work');

      function isPointerOverProjects(clientX, clientY) {
        if (!projectsSectionForCursor || !projectsSectionForCursor.getBoundingClientRect) return false;
        var r = projectsSectionForCursor.getBoundingClientRect();
        return (
          clientX >= r.left &&
          clientX <= r.right &&
          clientY >= r.top &&
          clientY <= r.bottom
        );
      }

      function runRevealObservers() {
        if ('IntersectionObserver' in window) {
          var revealObserver = new IntersectionObserver(
            function (entries) {
              for (var r = 0; r < entries.length; r++) {
                var entry = entries[r];
                if (!entry.isIntersecting || entry.intersectionRatio < 0.15) continue;
                var el = entry.target;
                el.classList.add('visible');
                revealObserver.unobserve(el);
              }
            },
            {
              root: null,
              rootMargin: '0px',
              threshold: [0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.5, 0.75, 1],
            }
          );
          for (var j = 0; j < revealTargets.length; j++) {
            revealObserver.observe(revealTargets[j]);
          }
        } else {
          for (var k = 0; k < revealTargets.length; k++) {
            revealTargets[k].classList.add('visible');
          }
        }
      }

      if (aboutSection && cursorEl && 'IntersectionObserver' in window) {
        var aboutCursorIO = new IntersectionObserver(
          function (entries) {
            for (var a = 0; a < entries.length; a++) {
              var en = entries[a];
              var inAbout =
                en.isIntersecting &&
                en.intersectionRatio > 0.02 &&
                en.boundingClientRect.top < (window.innerHeight || 1) * 0.95;
              if (inAbout) {
                cursorEl.classList.add('is-suppressed-in-about');
                cursorEl.classList.remove('is-visible');
              } else {
                cursorEl.classList.remove('is-suppressed-in-about');
              }
            }
          },
          { root: null, rootMargin: '0px', threshold: [0, 0.02, 0.06, 0.12, 0.2, 0.35, 0.5] }
        );
        aboutCursorIO.observe(aboutSection);
      }

      if (backToTopEl) {
        backToTopEl.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      if (!cursorEl) {
        runRevealObservers();
        return;
      }

      document.body.classList.add('is-hero-cursor-active');

      var CURSOR_TEXT_OFFSET_X = 14;
      var CURSOR_TEXT_OFFSET_Y = 16;
      var maxTiltX = 5.2;
      var maxTiltY = 5.8;
      var maxShiftX = 12;
      var maxShiftY = 10;
      /** Higher = snappier mouse follow; spring removed for gentle non-bouncy motion */
      var PARALLAX_SMOOTH_LAMBDA = 22;
      var parallaxState = {
        px: 0,
        py: 0,
        tpx: 0,
        tpy: 0,
        rx: 0,
        ry: 0,
        trx: 0,
        trY: 0,
      };
      var parallaxRafId = null;
      var lastParallaxTs = 0;

      function snapHeroParallax() {
        parallaxState.px = parallaxState.py = parallaxState.rx = parallaxState.ry = 0;
      }

      function resetParallaxTargets() {
        parallaxState.tpx = parallaxState.tpy = 0;
        parallaxState.trx = parallaxState.trY = 0;
      }

      function setParallaxTargetsFromMouse(clientX, clientY) {
        var nx;
        var ny;
        if (heroKamilMount && heroKamilMount.getBoundingClientRect) {
          var r = heroKamilMount.getBoundingClientRect();
          var rw = Math.max(r.width, 1);
          var rh = Math.max(r.height, 1);
          nx = (clientX - r.left) / rw - 0.5;
          ny = (clientY - r.top) / rh - 0.5;
          nx = Math.max(-0.55, Math.min(0.55, nx));
          ny = Math.max(-0.55, Math.min(0.55, ny));
        } else {
          var w = window.innerWidth || 1;
          var h = window.innerHeight || 1;
          nx = clientX / w - 0.5;
          ny = clientY / h - 0.5;
        }
        parallaxState.tpx = nx * maxShiftX * 2;
        parallaxState.tpy = ny * maxShiftY * 2;
        parallaxState.trx = -ny * maxTiltX * 2;
        parallaxState.trY = nx * maxTiltY * 2;
      }

      function smoothParallaxStep(dt) {
        var p = parallaxState;
        var dtSec = Math.min(50, dt) / 1000;
        var a = 1 - Math.exp(-PARALLAX_SMOOTH_LAMBDA * dtSec);
        p.px += (p.tpx - p.px) * a;
        p.py += (p.tpy - p.py) * a;
        p.rx += (p.trx - p.rx) * a;
        p.ry += (p.trY - p.ry) * a;
      }

      function applyHeroStackParallax() {
        if (!heroFloatInner) return;
        if (!isHeroMotionEnabled()) {
          heroFloatInner.style.transform = '';
          return;
        }
        var p = parallaxState;
        heroFloatInner.style.transform =
          'translate3d(' +
          p.px.toFixed(2) +
          'px,' +
          p.py.toFixed(2) +
          'px,0) rotateX(' +
          p.rx.toFixed(3) +
          'deg) rotateY(' +
          p.ry.toFixed(3) +
          'deg)';
      }

      function parallaxMoving() {
        var p = parallaxState;
        return (
          Math.abs(p.tpx - p.px) > 0.12 ||
          Math.abs(p.tpy - p.py) > 0.12 ||
          Math.abs(p.trx - p.rx) > 0.04 ||
          Math.abs(p.trY - p.ry) > 0.04
        );
      }

      function parallaxTick(ts) {
        if (!isHeroMotionEnabled() || !heroFloatInner) {
          parallaxRafId = null;
          lastParallaxTs = 0;
          return;
        }
        var now = ts != null ? ts : performance.now();
        var dt = lastParallaxTs ? Math.min(50, now - lastParallaxTs) : 16.67;
        lastParallaxTs = now;
        smoothParallaxStep(dt);
        applyHeroStackParallax();
        if (parallaxMoving()) {
          parallaxRafId = window.requestAnimationFrame(parallaxTick);
        } else {
          parallaxRafId = null;
          lastParallaxTs = 0;
        }
      }

      function scheduleParallaxTick() {
        if (parallaxRafId === null) parallaxRafId = window.requestAnimationFrame(parallaxTick);
      }

      function stopHeroParallaxNow() {
        if (parallaxRafId !== null) {
          window.cancelAnimationFrame(parallaxRafId);
          parallaxRafId = null;
        }
        lastParallaxTs = 0;
        resetParallaxTargets();
        snapHeroParallax();
        applyHeroStackParallax();
      }

      if (heroSectionForCursor && 'IntersectionObserver' in window) {
        var heroCursorIO = new IntersectionObserver(
          function (entries) {
            var en = entries[0];
            var active = en.isIntersecting && en.intersectionRatio >= 0.04;
            document.body.classList.toggle('is-hero-cursor-active', active);
            if (!active) {
              cursorEl.classList.remove('is-visible');
              stopHeroParallaxNow();
            }
          },
          { root: null, rootMargin: '0px', threshold: [0, 0.02, 0.04, 0.06, 0.1, 0.15, 0.25, 0.5, 0.75, 1] }
        );
        heroCursorIO.observe(heroSectionForCursor);
      }

      function moveCustomCursor(clientX, clientY) {
        var x = clientX + CURSOR_TEXT_OFFSET_X;
        var y = clientY + CURSOR_TEXT_OFFSET_Y;
        cursorEl.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)';
        if (!cursorEl.classList.contains('is-suppressed-in-about')) {
          cursorEl.classList.add('is-visible');
        }
      }

      function onMouseMove(e) {
        var overProjects = isPointerOverProjects(e.clientX, e.clientY);

        if (overProjects) {
          cursorEl.classList.remove('is-visible');
        } else if (document.body.classList.contains('is-hero-cursor-active')) {
          moveCustomCursor(e.clientX, e.clientY);
        } else {
          cursorEl.classList.remove('is-visible');
        }

        if (!heroFloatInner) return;
        if (!document.body.classList.contains('is-hero-cursor-active')) return;

        if (overProjects) {
          resetParallaxTargets();
          snapHeroParallax();
          scheduleParallaxTick();
          return;
        }

        if (isHeroMotionEnabled()) {
          setParallaxTargetsFromMouse(e.clientX, e.clientY);
          scheduleParallaxTick();
        } else {
          resetParallaxTargets();
          snapHeroParallax();
          lastParallaxTs = 0;
          applyHeroStackParallax();
        }
      }

      function onDocumentLeave() {
        cursorEl.classList.remove('is-visible');
        if (!document.body.classList.contains('is-hero-cursor-active')) return;
        resetParallaxTargets();
        if (isHeroMotionEnabled()) scheduleParallaxTick();
        else {
          snapHeroParallax();
          lastParallaxTs = 0;
          applyHeroStackParallax();
        }
      }

      window.addEventListener('resize', function () {
        if (!isHeroMotionEnabled()) {
          resetParallaxTargets();
          snapHeroParallax();
          lastParallaxTs = 0;
          if (parallaxRafId !== null) {
            window.cancelAnimationFrame(parallaxRafId);
            parallaxRafId = null;
          }
          applyHeroStackParallax();
        }
      }, { passive: true });

      runRevealObservers();

      window.addEventListener('mousemove', onMouseMove);
      document.documentElement.addEventListener('mouseleave', onDocumentLeave);
      window.addEventListener('blur', onDocumentLeave);

      if (cursorLabelEl) cursorLabelEl.textContent = 'scroll';
      if (isHeroMotionEnabled() && heroFloatInner && document.body.classList.contains('is-hero-cursor-active'))
        scheduleParallaxTick();
      else applyHeroStackParallax();
    })();

  </script>
  <script type="module" src="hero-kamil-3d.js"></script>
</body>
</html>
